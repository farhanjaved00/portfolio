<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiter Dashboard</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1b1f23; --muted:#65707a; --grid:#e3e7ec;
    --bar:#0a66c2; --bar-2:#5b9bd5; --card:#f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1d2226; --fg:#e8ecef; --muted:#9aa5ae; --grid:#363d44;
      --bar:#70b5f9; --bar-2:#3f7fc4; --card:#252b30;
    }
  }
  :root[data-theme="dark"] {
    --bg:#1d2226; --fg:#e8ecef; --muted:#9aa5ae; --grid:#363d44;
    --bar:#70b5f9; --bar-2:#3f7fc4; --card:#252b30;
  }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  h2 { font-size:15px; margin:0 0 8px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  button, input[type=file] { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--bar); background:var(--bar); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--bar); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:12px; }
  .tile { background:var(--card); border-radius:8px; padding:12px; }
  .tile .num { font-size:26px; font-weight:700; }
  .tile .lbl { color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:720px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:8px; padding:12px; min-width:0; }
  svg { width:100%; height:auto; display:block; overflow:visible; }
  .axis text, .lbl-txt { fill:var(--muted); font-size:11px; }
  .gridline { stroke:var(--grid); stroke-width:1; }
  .bar { fill:var(--bar); rx:4; }
  .bar:hover { fill:var(--bar-2); }
  #tip { position:fixed; pointer-events:none; background:var(--fg); color:var(--bg); padding:6px 8px; border-radius:6px; font-size:12px; opacity:0; transition:opacity .1s; max-width:240px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--grid); }
  details { margin-top:12px; }
  summary { cursor:pointer; color:var(--muted); }
  .empty { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<main>
  <h1>Recruiter Dashboard</h1>
  <div class="toolbar">
    <input id="file" type="file" accept=".csv,text/csv">
    <button id="demo" class="ghost">Load demo data</button>
    <button id="theme" class="ghost">Toggle theme</button>
  </div>

  <div id="content">
    <p class="empty">Load a <code>recruiters.csv</code> exported from the extension, or try the demo data.</p>
  </div>
</main>
<div id="tip"></div>

<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

// Minimal CSV parser that handles quoted fields and escaped quotes.
function parseCsv(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const [head, ...body] = rows.filter(r => r.some(x => x !== ""));
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
}

// Country/city guess: last comma-separated part of LinkedIn's location string.
function regionOf(loc) {
  if (!loc) return "Unknown";
  const parts = loc.split(",").map(s => s.trim()).filter(Boolean);
  return parts[parts.length - 1] || "Unknown";
}

function summarize(people) {
  const byRegion = {}, byScore = {};
  for (const p of people) {
    const r = regionOf(p.location);
    byRegion[r] = (byRegion[r] || 0) + 1;
    const s = Number(p.score) || 0;
    byScore[s] = (byScore[s] || 0) + 1;
  }
  const top = Object.entries(byRegion).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const scores = Object.entries(byScore).map(([k, v]) => [Number(k), v]).sort((a, b) => a[0] - b[0]);
  const withLoc = people.filter(p => p.location).length;
  const hiring = people.filter(p => Number(p.score) >= 2).length;
  return { top, scores, total: people.length, withLoc, hiring, regions: Object.keys(byRegion).length };
}

function el(name, attrs = {}, text) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

// Hover tooltip, shared by all marks.
const tip = $("tip");
function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  tip.style.left = e.clientX + 12 + "px";
  tip.style.top = e.clientY + 12 + "px";
}
function hideTip() { tip.style.opacity = 0; }

// Horizontal bar chart: magnitude -> one hue, sorted, value labels at bar ends.
function barChart(title, rows, unit) {
  const W = 460, rowH = 26, left = 120, right = 40, top = 6;
  const H = top + rows.length * rowH + 10;
  const max = Math.max(1, ...rows.map(r => r[1]));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title });
  const innerW = W - left - right;
  rows.forEach(([label, v], i) => {
    const y = top + i * rowH;
    svg.appendChild(el("text", { x: left - 8, y: y + rowH / 2 + 4, "text-anchor": "end", class: "lbl-txt" }, label.length > 18 ? label.slice(0, 17) + "…" : label));
    const w = Math.max(2, (v / max) * innerW);
    const bar = el("rect", { x: left, y: y + 4, width: w, height: rowH - 8, class: "bar", rx: 4 });
    bar.addEventListener("mousemove", e => showTip(e, `<b>${label}</b><br>${v} ${unit}`));
    bar.addEventListener("mouseleave", hideTip);
    svg.appendChild(bar);
    svg.appendChild(el("text", { x: left + w + 6, y: y + rowH / 2 + 4, class: "lbl-txt" }, v));
  });
  return svg;
}

// Column chart for score distribution.
function columnChart(title, pairs) {
  const W = 460, H = 220, pad = { l: 34, r: 10, t: 10, b: 28 };
  const max = Math.max(1, ...pairs.map(p => p[1]));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title });
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + innerH - (g / 4) * innerH;
    svg.appendChild(el("line", { x1: pad.l, x2: W - pad.r, y1: y, y2: y, class: "gridline" }));
    svg.appendChild(el("text", { x: pad.l - 6, y: y + 4, "text-anchor": "end", class: "lbl-txt" }, Math.round((g / 4) * max)));
  }
  const slot = innerW / Math.max(1, pairs.length);
  pairs.forEach(([score, v], i) => {
    const h = (v / max) * innerH;
    const x = pad.l + i * slot + slot * 0.2;
    const bw = slot * 0.6;
    const rect = el("rect", { x, y: pad.t + innerH - h, width: bw, height: h, class: "bar", rx: 4 });
    rect.addEventListener("mousemove", e => showTip(e, `<b>Score ${score}</b><br>${v} people`));
    rect.addEventListener("mouseleave", hideTip);
    svg.appendChild(rect);
    svg.appendChild(el("text", { x: x + bw / 2, y: H - 10, "text-anchor": "middle", class: "lbl-txt" }, score));
  });
  return svg;
}

function render(people) {
  const s = summarize(people);
  const content = $("content");
  content.innerHTML = "";
  if (!people.length) { content.innerHTML = '<p class="empty">No rows found in that file.</p>'; return; }

  const tiles = document.createElement("div");
  tiles.className = "tiles";
  [[s.total, "Recruiters"], [s.hiring, "Score ≥ 2"], [s.regions, "Locations"], [s.withLoc, "With location"]]
    .forEach(([n, l]) => {
      const t = document.createElement("div"); t.className = "tile";
      t.innerHTML = `<div class="num">${n}</div><div class="lbl">${l}</div>`;
      tiles.appendChild(t);
    });
  content.appendChild(tiles);

  const grid = document.createElement("div");
  grid.className = "grid";
  const c1 = document.createElement("div"); c1.className = "card";
  c1.innerHTML = "<h2>Top locations (people per region)</h2>";
  c1.appendChild(barChart("Top locations", s.top, "people"));
  const c2 = document.createElement("div"); c2.className = "card";
  c2.innerHTML = "<h2>Recruiter score distribution</h2>";
  c2.appendChild(columnChart("Score distribution", s.scores));
  grid.append(c1, c2);
  content.appendChild(grid);

  const det = document.createElement("details");
  det.innerHTML = "<summary>Show table</summary>";
  const tbl = document.createElement("table");
  tbl.innerHTML = "<tr><th>Name</th><th>Headline</th><th>Location</th><th>Score</th></tr>" +
    people.slice(0, 200).map(p => `<tr><td><a href="${p.profileUrl}" target="_blank" rel="noopener">${esc(p.name)}</a></td><td>${esc(p.headline)}</td><td>${esc(p.location)}</td><td>${esc(p.score)}</td></tr>`).join("");
  det.appendChild(tbl);
  content.appendChild(det);
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (f) render(parseCsv(await f.text()));
});

$("demo").addEventListener("click", () => {
  const regions = ["United States", "India", "United Kingdom", "Germany", "Canada", "Australia", "Singapore", "Netherlands", "Remote"];
  const demo = [];
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 180; i++) {
    const r = regions[Math.floor(Math.pow(rnd(), 1.6) * regions.length)];
    demo.push({
      name: `Recruiter ${i + 1}`, headline: "Technical Recruiter | Talent Acquisition",
      location: r === "Remote" ? "Remote" : `City, ${r}`,
      score: String(1 + Math.floor(rnd() * 4)), profileUrl: "https://www.linkedin.com/in/example/"
    });
  }
  render(demo);
});

$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
});
</script>
</body>
</html>
